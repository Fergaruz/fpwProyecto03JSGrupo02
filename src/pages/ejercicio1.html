<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1</title>
  <link rel="stylesheet" href="../css/ejercicio1.css">
</head>
<body>
  <h1>Ejercicio 1 - Lista de Estudiantes</h1>

  <div class="formulario">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ej: María">

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" placeholder="Ej: Diaz">

    <label for="libreta">Libreta Universitaria</label>
    <input type="text" id="libreta" placeholder="Ej: APU999999">

    <button id="btnMostrar">Guardar Estudiante</button>
  </div>

  <p id="mensajeError"></p>

  <h2>Estudiantes</h2>
  <table id="tablaDatos"></table>

  <!-- Primero el service, después el script que lo usa -->
  <script src="../services/servicesEjercicio1.js"></script>
  <script src="../js/ejercicio1.js"></script>
</body>
</html>
